name: AutoReturn CI

on:
  push:
    branches: [ main, final-version ]
  pull_request:
    branches: [ main, final-version ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"
        cache: 'pip'

    - name: Install Base Dependencies
      run: |
        python -m pip install --upgrade pip
        # We only install the base requirements needed for testing to save time.
        # We DO NOT download the 1GB spaCy or Whisper models here.
        pip install -r requirements.txt
        # Install pytest if it's not in requirements
        pip install pytest pytest-asyncio

    - name: Run Formal Tests
      run: |
        # Run the formal test suites
        if [ -d "testing_formal/tests" ]; then
          pytest testing_formal/tests/ -v
        elif [ -d "tests" ]; then
          pytest tests/ -v
        else
          echo "No tests found."
        fi
