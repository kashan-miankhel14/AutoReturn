name: AutoReturn CI

on:
  push:
    branches: [ main, final-version ]
  pull_request:
    branches: [ main, final-version ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    env:
      PYTHONPATH: ${{ github.workspace }}
      QT_QPA_PLATFORM: offscreen  # Run PySide6 headless
      
    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"
        cache: 'pip'
        
    - name: Install System Dependencies (GUI & Audio)
      run: |
        sudo apt-get update
        sudo apt-get install -y xvfb libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-xinerama0 libxcb-xfixes0 libgl1 libportaudio2 dbus-x11

    - name: Install Base Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-asyncio pytest-qt

    - name: Run Formal Tests (with Virtual Display)
      run: |
        # Use xvfb-run to provide a virtual X11 display for PySide6 GUI tests
        if [ -d "testing_formal/tests" ]; then
          xvfb-run -a pytest testing_formal/tests/ -v
        elif [ -d "tests" ]; then
          xvfb-run -a pytest tests/ -v
        else
          echo "No tests found."
        fi
